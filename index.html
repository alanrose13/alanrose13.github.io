<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alan & Rose - Shop</title>

  <!-- CSS DEL POPUP - CARICATO SEMPRE, NON BLOCCATO -->
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0d0d0d; color: #fff; }
    
    /* SFONDO CON PUNTINI - SI VEDE SEMPRE */
    .cookie-popup-bg {
      background: #1a1a1a url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60"><circle cx="10" cy="10" r="1.5" fill="%23ffffff" opacity="0.08"/><circle cx="30" cy="30" r="1.5" fill="%23ffffff" opacity="0.08"/><circle cx="50" cy="50" r="1.5" fill="%23ffffff" opacity="0.08"/></svg>');
    }

    /* POPUP COOKIE */
    #cookie-popup {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      max-width: 600px;
      margin: auto;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      z-index: 9999;
      display: none; /* Cookiebot lo mostra da solo */
    }
    #cookie-popup h3 { margin-top: 0; color: #fff; }
    #cookie-popup p { font-size: 14px; line-height: 1.5; color: #ccc; }
    #cookie-popup .btns { display: flex; gap: 10px; margin-top: 15px; }
    #cookie-popup button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-accept { background: #4CAF50; color: #fff; }
    .btn-reject { background: #555; color: #fff; }
    .btn-settings { background: transparent; border: 1px solid #777; color: #ccc; }
    #cookie-popup a { color: #4CAF50; text-decoration: none; }
  </style>

  <!-- 1. COOKIEBOT - METTERE IL TUO ID -->
  <script id="Cookiebot" 
    src="https://consent.cookiebot.com/uc.js" 
    data-cbid="IL-TUO-ID" 
    data-blockingmode="auto" 
    type="text/javascript">
  </script>

</head>
<body>

  <!-- IL TUO SITO -->
  <header>
    <h1>Alan & Rose</h1>
    <p>Shop Dropshipping</p>
  </header>

  <main>
    <h2>Prodotto in evidenza</h2>
    <p>Qui va il tuo prodotto + pulsante PayPal/Stripe</p>
    
    <!-- ESEMPIO PULSANTE PAYPAL - SARA' BLOCCATO FINO ACCETTAZIONE -->
    <script type="text/plain" data-cookieconsent="marketing">
      // QUI DENTRO METTI CODICE PAYPAL, PIXEL, ANALYTICS
      console.log("Script marketing caricato dopo consenso");
    </script>
  </main>

  <footer>
    <a href="/privacy.html">Privacy Policy</a> | 
    <a href="javascript:Cookiebot.renew()">Impostazioni Cookie</a>
  </footer>

  <!-- 2. SCRIPT PER FAR VEDERE IL POPUP SE COOKIEBOT NON LO FA -->
  <script>
    window.addEventListener('CookiebotOnAccept', function() {
      console.log("Consenso dato");
    });
  </script>

</body>
</html>
